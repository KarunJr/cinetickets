name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '24.15.0'
        
      - name: Install Dependencies
        run: npm ci

      - name: Lint Source Files
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run
  