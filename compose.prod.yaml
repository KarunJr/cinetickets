services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      args:
        NEXT_PUBLIC_BASE_URL: http://192.168.1.216
        NEXT_PUBLIC_TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p/original
      context: .
    env_file:
      - ./.env.docker.prod
    environment:
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://inngest:8288
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  inngest:
    image: inngest/inngest
    env_file:
      - ./.env.docker.prod
    command: ["inngest", "start", "--sdk-url", "http://web:3000/api/inngest"]
    ports:
      - "8288:8288"
      - "8289:8289"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

        

