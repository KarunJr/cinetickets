services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    depends_on:
      - nginx
    command: 
      - "http"
      - "nginx:80"
      - "--url=multiply-oversized-ceramics.ngrok-free.dev"
    env_file:
      - ./.env.docker.prod
    restart: unless-stopped

  web:
    image: ghcr.io/karunjr/cinetickets:${IMAGE_TAG}
    env_file:
      - ./.env.docker.prod
    environment:
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://inngest:8288
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  inngest:
    image: inngest/inngest
    env_file:
      - ./.env.docker.prod
    command: ["inngest", "start", "--sdk-url", "http://web:3000/api/inngest"]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

        

