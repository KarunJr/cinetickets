services:  
  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
  
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
  
  inngest:
    image: inngest/inngest
    container_name: inngest-dev
    command: ["inngest", "start", "--sdk-url", "http://web:3000/api/inngest"]
    ports:
      - "8288:8288"
      - "8289:8289"
    restart: always
    env_file:
      - ./.env.local
  
volumes:
  mongo-data:
  redis-data:
